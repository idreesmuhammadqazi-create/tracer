version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lowlogic-backend
    ports:
      - "8765:8765"
    networks:
      - lowlogic-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lowlogic-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lowlogic-network
    restart: unless-stopped

networks:
  lowlogic-network:
    driver: bridge